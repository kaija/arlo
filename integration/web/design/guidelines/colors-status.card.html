<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Low-chroma success / warning / danger, each with an 8% tint" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.sw{height:44px;border-radius:var(--radius-sm)}.tint{height:22px;border-radius:var(--radius-xs);margin-top:6px;border:1px solid var(--color-border)}.n{display:block;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}</style></head><body><div class="row">
<div><div class="sw" style="background:var(--color-accent)"></div><div class="tint" style="background:var(--color-accent-light)"></div><span class="n">--color-accent<br>#5856D6 · info</span></div>
<div><div class="sw" style="background:var(--color-success)"></div><div class="tint" style="background:var(--color-success-light)"></div><span class="n">--color-success<br>#1f9d6b</span></div>
<div><div class="sw" style="background:var(--color-warning)"></div><div class="tint" style="background:var(--color-warning-light)"></div><span class="n">--color-warning<br>#c07a12</span></div>
<div><div class="sw" style="background:var(--color-danger)"></div><div class="tint" style="background:var(--color-danger-light)"></div><span class="n">--color-danger<br>#d1435b</span></div>
</div></body></html>
