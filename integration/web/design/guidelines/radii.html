<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{flex:1;min-width:90px}.chip{height:64px;border-radius:12px;border:1px solid rgba(0,0,0,0.06)}.lbl{font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);margin-top:6px}.lbl b{display:block;color:var(--color-text-primary);font-family:var(--font-sans);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-bg-tertiary);border-radius:var(--radius-sm)"></div><div class="lbl"><b>sm</b>--radius-sm · 8px</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-tertiary);border-radius:var(--radius-md)"></div><div class="lbl"><b>md</b>--radius-md · 12px</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-tertiary);border-radius:var(--radius-lg)"></div><div class="lbl"><b>lg</b>--radius-lg · 16px</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-tertiary);border-radius:var(--radius-xl)"></div><div class="lbl"><b>xl</b>--radius-xl · 24px</div></div><div class="sw"><div class="chip" style="background:var(--color-accent);border-radius:var(--radius-pill);height:44px;margin-top:10px"></div><div class="lbl"><b>pill</b>--radius-pill · 999px</div></div></div></body></html>
