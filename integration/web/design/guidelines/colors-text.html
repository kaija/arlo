<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{flex:1;min-width:90px}.chip{height:64px;border-radius:12px;border:1px solid rgba(0,0,0,0.06)}.lbl{font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);margin-top:6px}.lbl b{display:block;color:var(--color-text-primary);font-family:var(--font-sans);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-text-primary)"></div><div class="lbl"><b>Primary</b>--color-text-primary · #1a1a2e</div></div><div class="sw"><div class="chip" style="background:var(--color-text-secondary)"></div><div class="lbl"><b>Secondary</b>--color-text-secondary · #64648c</div></div><div class="sw"><div class="chip" style="background:var(--color-text-tertiary)"></div><div class="lbl"><b>Tertiary</b>--color-text-tertiary · #8e8eaa</div></div></div></body></html>
