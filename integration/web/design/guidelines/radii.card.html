<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="5 · 7 · 8 · 12 · 16 · 24 · pill — what each one is for" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body)}.row{display:flex;gap:16px;align-items:flex-end}.i{flex:1;text-align:center}.b{height:56px;background:var(--color-accent-light);border:1px solid var(--color-accent-glow)}.n{display:block;margin-top:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);line-height:1.45}</style></head><body><div class="row">
<div class="i"><div class="b" style="border-radius:var(--radius-xs)"></div><span class="n">xs · 5px<br>checkbox</span></div>
<div class="i"><div class="b" style="border-radius:var(--radius-mark)"></div><span class="n">mark · 7px<br>brand mark</span></div>
<div class="i"><div class="b" style="border-radius:var(--radius-sm)"></div><span class="n">sm · 8px<br>input, icon box</span></div>
<div class="i"><div class="b" style="border-radius:var(--radius-md)"></div><span class="n">md · 12px<br>alert, toast, stack node</span></div>
<div class="i"><div class="b" style="border-radius:var(--radius-lg)"></div><span class="n">lg · 16px<br>card, table, dialog</span></div>
<div class="i"><div class="b" style="border-radius:var(--radius-xl)"></div><span class="n">xl · 24px<br>large panels</span></div>
<div class="i"><div class="b" style="border-radius:var(--radius-pill)"></div><span class="n">pill · 999px<br>button, badge, tag, tabs</span></div>
</div></body></html>
