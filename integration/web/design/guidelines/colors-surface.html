<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{flex:1;min-width:90px}.chip{height:64px;border-radius:12px;border:1px solid rgba(0,0,0,0.06)}.lbl{font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);margin-top:6px}.lbl b{display:block;color:var(--color-text-primary);font-family:var(--font-sans);font-weight:600;font-size:12px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-bg);border-color:rgba(0,0,0,0.12)"></div><div class="lbl"><b>Page</b>--color-bg · #ffffff</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-secondary)"></div><div class="lbl"><b>Section</b>--color-bg-secondary · #f8f8fc</div></div><div class="sw"><div class="chip" style="background:var(--color-bg-tertiary)"></div><div class="lbl"><b>Tertiary</b>--color-bg-tertiary · #f0f0f8</div></div><div class="sw"><div class="chip" style="background:#fff;border:1px solid var(--color-border)"></div><div class="lbl"><b>Border</b>rgba(0,0,0,.06)</div></div><div class="sw"><div class="chip" style="background:#fff;border:1px solid var(--color-border-strong)"></div><div class="lbl"><b>Border strong</b>rgba(0,0,0,.1)</div></div></div></body></html>
