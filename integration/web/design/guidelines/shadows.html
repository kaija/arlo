<!-- @dsCard group="Foundations" viewport="700x160" name="Shadows" subtitle="Soft black-alpha elevations; accent glow ring for highlighted cards" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.sw{flex:1;min-width:90px}.chip{height:64px;border-radius:12px;border:1px solid rgba(0,0,0,0.06)}.lbl{font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);margin-top:6px}.lbl b{display:block;color:var(--color-text-primary);font-family:var(--font-sans);font-weight:600;font-size:12px}</style></head><body style="background:var(--color-bg-secondary)"><div class="row"><div class="sw"><div class="chip" style="background:#fff;border:none;box-shadow:var(--shadow-sm)"></div><div class="lbl"><b>sm</b>--shadow-sm</div></div><div class="sw"><div class="chip" style="background:#fff;border:none;box-shadow:var(--shadow-md)"></div><div class="lbl"><b>md</b>--shadow-md</div></div><div class="sw"><div class="chip" style="background:#fff;border:none;box-shadow:var(--shadow-lg)"></div><div class="lbl"><b>lg</b>--shadow-lg</div></div><div class="sw"><div class="chip" style="background:#fff;border:none;box-shadow:var(--shadow-xl)"></div><div class="lbl"><b>xl</b>--shadow-xl</div></div><div class="sw"><div class="chip" style="background:#fff;border:none;box-shadow:var(--shadow-md),0 0 0 1px var(--color-accent-glow)"></div><div class="lbl"><b>accent ring</b>md + glow ring</div></div></div></body></html>
