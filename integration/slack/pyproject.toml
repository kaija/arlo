[project]
name = "arlo-slack"
version = "0.1.0"
description = "Slack Socket Mode proxy for arlo --serve (AG-UI)"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.21",
    "aiohttp>=3.10",       # socket mode transport for slack-bolt
    "httpx>=0.27",
    "httpx-sse>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
arlo-slack = "arlo_slack.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arlo_slack"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
